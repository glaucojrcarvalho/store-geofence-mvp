name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: geofence
          POSTGRES_PASSWORD: geofence
          POSTGRES_DB: geofence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U geofence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt
          python -m pip install pip-audit

      - name: Compile Python modules
        run: python -m compileall -q app tests migrations

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          PYTHONPATH: ${{ github.workspace }}
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: geofence
          POSTGRES_USER: geofence
          POSTGRES_PASSWORD: geofence
          PYTHONPATH: ${{ github.workspace }}
          E2E_DB_WAIT: 120
          ENABLE_PRIVATE_API: "true"
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t store-geofence-demo:ci .
