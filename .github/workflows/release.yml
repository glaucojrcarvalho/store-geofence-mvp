name: Deploy Published Release to Vercel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published stable GitHub release tag to redeploy"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: store-geofence-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "59.15.1"

    steps:
      - name: Normalize and validate release tag input
        id: release_tag
        env:
          RAW_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # GitHub's manual text input may contain accidental whitespace.
          TAG="$(printf '%s' "$RAW_RELEASE_TAG" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "Expected a version tag like v0.2.1"; exit 1; }
          printf 'value=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out exactly the published release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release_tag.outputs.value }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify version tag and main ancestry
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version tag required"; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Release commit is not on main"; exit 1; }
          echo "Releasing tested commit $(git rev-parse HEAD)"

      - name: Verify tag belongs to an existing published stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,isDraft,isPrerelease \
            | jq -e --arg expected "$RELEASE_TAG" '.tagName == $expected and (.isDraft == false) and (.isPrerelease == false)' >/dev/null ||
            { echo "Tag must be an existing published stable GitHub release"; exit 1; }

      - name: Verify CI passed for the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          result="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" -f "head_sha=$SHA" -f per_page=50 --jq '[.workflow_runs[] | select(.head_sha == "'$SHA'" and .conclusion == "success")] | length')"
          test "$result" -ge 1 || { echo "No successful CI for the release commit"; exit 1; }

      - name: Set up Python for independent static checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the exact released public assets
        run: |
          python -m pip install "pytest==8.4.2"
          python -m pytest -q --noconftest tests/test_public_demo_static.py

      - name: Verify Vercel target is explicitly configured
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull the authorized production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          vercel pull --yes --environment=production

      - name: Build the release without uploading repository source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Verify static build output
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json || { echo "Vercel output config missing"; exit 1; }
          test -f .vercel/output/static/index.html || { echo "Built demo index missing"; exit 1; }
          test -f .vercel/output/static/app.js || { echo "Built demo JS missing"; exit 1; }
          test -f .vercel/output/static/styles.css || { echo "Built demo CSS missing"; exit 1; }
          test ! -d .vercel/output/functions || { echo "Unexpected serverless functions in static demo"; exit 1; }
          test ! -d .vercel/output/services || { echo "Unexpected services in static demo"; exit 1; }

      - name: Deploy only the prebuilt release artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod
