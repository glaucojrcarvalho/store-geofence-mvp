name: Publish Public Geofence Demo

on:
  push:
    branches: [main]
    paths:
      - "public-demo/**"
      - "tests/test_public_demo_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-geofence-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install demo test dependencies
        run: python -m pip install "pytest==8.4.2"

      - name: Verify static deploy boundary
        run: python -m pytest -q --noconftest tests/test_public_demo_static.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload ONLY public assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-demo

      - name: Publish static site
        id: publish
        uses: actions/deploy-pages@v4
