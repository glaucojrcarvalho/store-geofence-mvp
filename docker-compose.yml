# Development stack ONLY. Never deploy this file unmodified on a public server.
services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    working_dir: /code
    environment:
      - PYTHONPATH=/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/code

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    working_dir: /code
    environment:
      - PYTHONPATH=/code
    command: celery -A app.workers.celery_app:celery_app worker -l info -Q geocode
    volumes:
      - ./:/code

  flower:
    profiles: ["monitoring"]
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app:celery_app flower --port=5555 --broker=${REDIS_URL}
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  db-data:
